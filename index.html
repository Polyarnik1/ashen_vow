html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a7fb0;font:16px 'Pix',monospace;letter-spacing:2px}
#pad{position:absolute;left:0;right:0;display:none;pointer-events:none}
body.touch #pad{display:block}
#joy{position:absolute;pointer-events:auto;border-radius:50%;background:radial-gradient(circle,rgba(140,120,200,.18),rgba(40,30,60,.35));border:2px solid rgba(180,160,230,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d8d0f0,#6a5a9a);box-shadow:0 0 12px rgba(160,140,255,.5);pointer-events:none}
.btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font:bold 22px 'Pix',monospace;color:#f0e8d0;touch-action:none;border:2px solid rgba(255,220,140,.5);background:radial-gradient(circle at 40% 35%,rgba(200,150,60,.55),rgba(80,40,20,.6));box-shadow:0 2px 0 rgba(0,0,0,.6)}
.btn.on{transform:scale(.92);filter:brightness(1.4)}
#bB{background:radial-gradient(circle at 40% 35%,rgba(120,120,170,.5),rgba(40,40,70,.6));border-color:rgba(180,180,240,.45)}
#bM{border-radius:10px;font-size:18px;background:rgba(40,30,60,.6);border-color:rgba(180,160,230,.4)}
/* portrait: controls below the screen */
body.portrait #joy{width:min(40vw,170px);height:min(40vw,170px);left:7vw;top:calc(50% - min(20vw,85px))}
body.portrait #bA{width:min(22vw,92px);height:min(22vw,92px);right:6vw;top:calc(50% - min(17vw,70px))}
body.portrait #bB{width:min(16vw,68px);height:min(16vw,68px);right:calc(6vw + min(23vw,96px));top:calc(50% + min(1vw,4px))}
body.portrait #bM{width:min(14vw,56px);height:min(10vw,40px);right:6vw;top:4px}
body.portrait #hint{display:block}
#hint{display:none;position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#4a4560;font:13px 'Pix',sans-serif}
/* landscape touch: controls in side columns */
body.landscape #joy{width:calc(var(--side) * .86);height:calc(var(--side) * .86);left:calc(var(--side) * .07 + env(safe-area-inset-left) * .5);bottom:8vh}
body.landscape #bA{width:calc(var(--side) * .52);height:calc(var(--side) * .52);right:calc(var(--side) * .08);bottom:calc(8vh + var(--side) * .42)}
body.landscape #bB{width:calc(var(--side) * .4);height:calc(var(--side) * .4);right:calc(var(--side) * .5);bottom:8vh}
body.landscape #bM{width:calc(var(--side) * .4);height:calc(var(--side) * .28);right:calc(var(--side) * .08);top:5vh}
.btn{font-family:system-ui,-apple-system,'Segoe UI',sans-serif!important}

<body>
<canvas id="game" tabindex="0"></canvas>
<div id="loading">ПЕПЕЛЬНЫЙ ОБЕТ…</div>
<div id="pad"><div id="joy"><div id="knob"></div></div><div id="bB" class="btn">B</div><div id="bA" class="btn">A</div><div id="bM" class="btn">☰</div><div id="hint">Поверните телефон — экран станет больше</div></div>
<script>
// ---- 01_engine.js ----
'use strict';
// ================= CORE / CANVAS =================
const W = 320, H = 180, TS = 16;
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const low = document.createElement('canvas'); low.width = W; low.height = H;
const lc = low.getContext('2d');
// Touch UI only on real touch-first devices (phones/tablets). Desktops and touchscreen laptops
// have a fine primary pointer (mouse/trackpad), so they keep the plain keyboard layout.
let isTouch = (() => {
  if (/[?&]touch=0/.test(location.search)) return false;
  if (/[?&]touch=1/.test(location.search)) return true;
  const mm = q => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
  const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (!hasTouch) return false;
  if (mm('(pointer: fine)') && mm('(hover: hover)')) return false; // mouse/trackpad is primary
  return mm('(pointer: coarse)') || mm('(hover: none)') || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
})();
let PR = 1; // canvas pixels per logical pixel
let FRAME = 0, TIME = 0;

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const portrait = vh > vw * 1.05;
  document.body.classList.toggle('portrait', portrait);
  document.body.classList.toggle('landscape', !portrait);
  document.body.classList.toggle('touch', isTouch);
  let aw = vw, ah = vh, side = 0;
  const dropY = isTouch ? 0 : Math.round(vh * 0.06); // desktop: picture sits lower, gap on top
  if (!isTouch) ah = vh - dropY;
  if (isTouch && portrait) ah = Math.min(vh * 0.55, vw * H / W + 24);
  if (isTouch && !portrait) { side = clamp(vw * 0.15, 90, 170); aw = vw - side * 2; }
  let s = Math.min(aw / W, ah / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = ((vw - cw) / 2) + 'px';
  const top = (isTouch && portrait) ? 12 : isTouch ? (vh - ch) / 2 : Math.max(0, vh - ch - Math.round(dropY * 0.15));
  cv.style.top = top + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.max(W, Math.round(cw * dpr)); cv.height = Math.max(H, Math.round(ch * dpr));
  PR = cv.width / W;
  const pad = $('pad');
  if (pad) {
    if (isTouch && portrait) { const pt = top + ch + 8; pad.style.top = pt + 'px'; pad.style.height = Math.min(vh - pt, 360) + 'px'; }
    else { pad.style.top = '0px'; pad.style.height = vh + 'px'; }
    document.documentElement.style.setProperty('--side', side + 'px');
  }
}
window.addEventListener('resize', layout);
// Hybrid devices: switch the touch overlay off when a keyboard / mouse is used, back on when a finger is.
window.addEventListener('keydown', e => { if (isTouch && !e.repeat && e.key && e.key.length <= 12 && e.isTrusted) { isTouch = false; layout(); } }, true);
window.addEventListener('pointerdown', e => {
  const t = e.pointerType === 'touch' || e.pointerType === 'pen';
  if (t !== isTouch && (e.pointerType === 'mouse' ? isTouch : !isTouch)) { isTouch = t; layout(); }
}, true);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

// ================= UTIL =================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function seeded(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return (s % 100000) / 100000; }; }
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; }

// ================= INPUT =================
const Input = {
  held: {}, pressed: {}, t: {}, ax: 0, ay: 0, joy: false, anyPress: false,
  down(b) { if (!this.held[b]) { this.pressed[b] = true; this.t[b] = 0; this.anyPress = true; } this.held[b] = true; },
  up(b) { this.held[b] = false; },

// light glow sprites (precomputed radial gradients)
const GLOW = {};

// flame animation (drawn live on low canvas)
function drawFlame(g, x, y, s = 1, t = 0, col = 'warm') {
  const f = Math.sin(t * 17 + x) * 0.5 + Math.sin(t * 11 + y * 1.3) * 0.5;
  const pal = col === 'blue' ? ['#3a6aff', '#8fc8ff', '#e8f6ff'] : col === 'green' ? ['#2a8a5a', '#7af0b0', '#e0fff0'] : col === 'rust' ? ['#a03a10', '#ff7a2a', '#ffe0a0'] : ['#c8401a', '#ffa030', '#fff0b0'];
  const h = (5 + f * 1.2) * s;
  g.fillStyle = pal[0]; g.fillRect(Math.round(x - 1.5 * s), Math.round(y - h), Math.max(1, Math.round(3 * s)), Math.round(h));
  g.fillStyle = pal[1]; g.fillRect(Math.round(x - 1 * s), Math.round(y - h * 0.75), Math.max(1, Math.round(2 * s)), Math.round(h * 0.75));
  g.fillStyle = pal[2]; g.fillRect(Math.round(x - 0.5 * s), Math.round(y - h * 0.4), Math.max(1, Math.round(1 * s)), Math.max(1, Math.round(h * 0.4)));
}

// ================= HOUSES =================
function makeHouse(w, h, o = {}) { // w,h in tiles; roof color
  const pw = w * 16, ph = h * 16;
  return pixelize(mk(pw, ph, g => {
    const r = seeded(pw * 7 + ph);
    const wallTop = Math.floor(ph * 0.48);
    // walls
    R(g, 1, wallTop, pw - 2, ph - wallTop, o.wall || '#4a3a2e');
    for (let x = 1; x < pw; x += 8) R(g, x, wallTop, 1, ph - wallTop, shade(o.wall || '#4a3a2e', -0.3));
    R(g, 1, wallTop, pw - 2, 2, '#2a1e16');
    R(g, 1, ph - 3, pw - 2, 3, '#2a2420');
    // timber
    R(g, 1, wallTop + 8, pw - 2, 2, '#2e2016');
    // roof
    const rc = o.roof || '#2e2a3a', rcd = shade(rc, -0.3), rcl = shade(rc, 0.15);
    poly(g, [0, wallTop + 2, pw / 2, 0, pw, wallTop + 2], rc);
    poly(g, [0, wallTop + 2, pw / 2, 0, pw / 2, wallTop + 2], rcd);
    for (let y = 4; y < wallTop; y += 4) { const hw = (y / wallTop) * pw / 2; R(g, pw / 2 - hw, y, hw * 2, 1, shade(rc, -0.4)); }
    R(g, pw / 2 - 1, 0, 2, wallTop + 2, rcl);
    speck(g, 4, 4, pw - 8, wallTop - 6, [rcl, rcd], 30, r);
    // door
    const dx = o.doorX != null ? o.doorX * 16 + 4 : Math.floor(pw / 2) - 4;
    R(g, dx, ph - 15, 9, 12, '#1a120c'); R(g, dx + 1, ph - 14, 7, 11, '#3e2a1a'); R(g, dx + 6, ph - 9, 1, 2, '#c8a85a');
    // windows (glow)
    const wins = o.windows || [0.22, 0.78];
    for (const fx of wins) { const wx = Math.floor(pw * fx) - 4; R(g, wx, wallTop + 12, 8, 7, '#1a120c'); R(g, wx + 1, wallTop + 13, 6, 5, o.dark ? '#1a1e2a' : '#ffb85a'); R(g, wx + 4, wallTop + 13, 1, 5, '#1a120c'); R(g, wx + 1, wallTop + 15, 6, 1, '#1a120c'); }

    if (B.state === 'item' && cur) text(ITEMS[cur].d, 300, ty + 27, '#8a85a0', 6.5, 'right');

  }

  }

// ================= MAP BUILDER =================
function G2(w, h, f) { return Array.from({ length: h }, () => Array(w).fill(f)); }
function rect(g, x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (g[y] && g[y][x] !== undefined) g[y][x] = c; }
function disc(g, cx, cy, r, c, rng) { for (let y = cy - r - 1; y <= cy + r + 1; y++) for (let x = cx - r - 1; x <= cx + r + 1; x++) { if (!g[y] || g[y][x] === undefined) continue; const d = (x - cx) ** 2 + (y - cy) ** 2; if (d <= r * r * (rng ? 0.75 + 0.5 * rng() : 1)) g[y][x] = c; } }
function pathL(g, pts, w, c, only) { for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2 + 1; for (let k = 0; k <= n; k++) { const x = Math.round(lerp(x0, x1, k / n)), y = Math.round(lerp(y0, y1, k / n)); for (let yy = y - w; yy <= y + w; yy++) for (let xx = x - w; xx <= x + w; xx++) if (g[yy] && g[yy][xx] !== undefined && (!only || only.includes(g[yy][xx]))) g[yy][xx] = c; } } }
function scat(g, c, on, dens, rng, cond) { for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++) if (on.includes(g[y][x]) && rng() < dens && (!cond || cond(x, y))) g[y][x] = c; }
function nearCh(g, x, y, ch, r = 1) { for (let yy = y - r; yy <= y + r; yy++) for (let xx = x - r; xx <= x + r; xx++) if (g[yy] && g[yy][xx] === ch) return true; return false; }
function put(g, x, y, c) { if (g[y] && g[y][x] !== undefined) g[y][x] = c; }
function rows(g) { return g.map(r => r.join('')); }
function clearAround(g, list, ch = '.') { for (const [x, y] of list) { const c = g[y] && g[y][x]; if (c && 'TDbrgB+CmFkK"'.includes(c)) g[y][x] = ch; } }

async function shop(title, list) {
  while (true) {
    const avail = list.filter(i => !i.cond || i.cond());
    const opts = avail.map(i => { const nm = i.equip ? EQUIP[i.id].n : ITEMS[i.id].n; const own = i.equip && G.flags['own_' + i.id]; return `${nm} — ${own ? 'есть' : i.price + 'м'}`; });
    opts.push('Уйти');
    const k = await choose(opts, { title: `${title}  (у тебя ${G.gold}м)`, cancel: true });
    if (k < 0 || k === avail.length) return;
    const it = avail[k];
    if (it.equip && G.flags['own_' + it.id]) { await nar('У тебя это уже есть.'); continue; }
    if (G.gold < it.price) { sfx('deny'); await nar('Не хватает монет.'); continue; }
    if (!it.equip && G.items.length >= 12) { sfx('deny'); await nar('Сумка переполнена.'); continue; }
    G.gold -= it.price; sfx('item');
    if (it.equip) { G.flags['own_' + it.id] = true; const c = await choose(['Надеть сейчас', 'Позже']); if (c === 0) { G[EQUIP[it.id].slot] = it.id; sfx('equip'); } }
    else G.items.push(it.id);
  }
}
